name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project tests/CmdPalCalendar.Tests

      - name: Build extension
        run: dotnet build CmdPalCalendar/CmdPalCalendar.csproj -c Release -p:Platform=x64

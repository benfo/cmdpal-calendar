name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project tests/CmdPalCalendar.Tests

      - name: Check trimmed build
        shell: pwsh
        run: |
          dotnet publish tests/CmdPalCalendar.TrimCheck -c Release -o $env:RUNNER_TEMP/trimcheck
          & $env:RUNNER_TEMP/trimcheck/CmdPalCalendar.TrimCheck.exe

      - name: Build extension
        run: dotnet build CmdPalCalendar/CmdPalCalendar.csproj -c Release -p:Platform=x64
